# The platform's own long-running parts. The application itself (plat-blue / plat-green) is started by the pipeline, not by this file.
name: platform

networks:
  default:
    name: platform-net            # the pipeline starts the app containers on this network, so the router can reach them by name

services:
  registry:
    image: ${REGISTRY_IMAGE:-registry:2}
    container_name: plat-registry
    restart: unless-stopped
    ports: ["127.0.0.1:5000:5000"]          # localhost only: docker push/pull and the scripts use localhost:5000
    volumes: ["registry_data:/var/lib/registry"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/v2/"]
      interval: 5s
      timeout: 3s
      retries: 20

  router:
    build: ./platform
    image: platform-demo:local
    container_name: plat-router
    restart: unless-stopped
    command: ["python", "router.py"]
    environment:
      CONFIG_FILE: /config/router.json
      PORT: "8080"
    ports: ["8080:8080"]                    # the public entry point: users, and the live service
    volumes: ["./state:/config:ro"]

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.54.1}
    container_name: plat-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2h
    ports: ["127.0.0.1:9090:9090"]          # localhost only: the console reads it
    volumes:
      - ./platform/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./platform/rules.yml:/etc/prometheus/rules.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  traffic:
    build: ./platform
    image: platform-demo:local
    container_name: plat-traffic
    restart: unless-stopped
    command: ["python", "traffic.py"]
    environment:
      TARGET: http://router:8080/
      RATE: ${TRAFFIC_RATE:-20}
    depends_on: [router]

  console:
    build: ./platform
    image: platform-demo:local
    container_name: plat-console
    restart: unless-stopped
    command: ["python", "console.py"]
    environment:
      ROUTER_URL: http://router:8080
      PROM_URL: http://prometheus:9090
      REGISTRY_URL: http://registry:5000
      REPO: platform/shop
      RESULTS_DIR: /results
      STATE_DIR: /state
      PORT: "8081"
    ports: ["8081:8081"]
    volumes: ["./results:/results:ro", "./state:/state:ro"]
    depends_on: [router, prometheus, registry]

volumes:
  registry_data:
